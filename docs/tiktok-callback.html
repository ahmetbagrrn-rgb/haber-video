<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok bağlantısı</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.6}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px;font-size:15px}</style></head><body>
<h1>TikTok bağlantısı</h1>
<p id="msg">Kod okunuyor…</p><code id="code"></code>
<script>
const p=new URLSearchParams(location.search);const c=p.get('code');const e=p.get('error_description')||p.get('error');
if(c){document.getElementById('msg').textContent='Bağlantı başarılı. Aşağıdaki kodu kopyalayıp Claude\'a gönder (10 dakika geçerli):';document.getElementById('code').textContent=c;}
else{document.getElementById('msg').textContent='Hata: '+(e||'kod bulunamadı');}
</script></body></html>
