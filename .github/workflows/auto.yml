name: Otomatik video (YouTube kanalı / haber akışı)

on:
  schedule:
    # İstanbul saatiyle 10:00 (YouTuber), 12:30 (yalnız YouTuber), 15:00 (trend), 17:30 (yalnız YouTuber), 20:00 (YouTuber)
    - cron: "0 7 * * *"
    - cron: "30 9 * * *"
    - cron: "0 12 * * *"
    - cron: "30 14 * * *"
    - cron: "0 17 * * *"
    # Pazar 12:00 (İstanbul): haftalık uzun video
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Günlük sınırı yok say"
        type: boolean
        default: false
  repository_dispatch:
    types: [auto]

permissions:
  contents: write

concurrency:
  group: auto
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts pillow
          mkdir -p fonts
          curl -fsSL -o fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true
          curl -fsSL -o fonts/PlayfairDisplay-Italic.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf" || true
          curl -fsSL -o fonts/Montserrat-Bold.ttf https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Bold.ttf || true

      - name: Konu seç, video üret, yayına gönder
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ github.event.client_payload.slot || (github.event.schedule == '0 12 * * *' && 'trend') || (github.event.schedule == '0 9 * * 0' && 'long') || ((github.event.schedule == '30 9 * * *' || github.event.schedule == '30 14 * * *') && 'yt') || 'source' }}
          FORCE: ${{ (github.event.inputs.force == 'true' || github.event.client_payload.force == true) && '1' || '0' }}
          PUBLISH: ${{ github.event.client_payload.test == true && 'false' || 'true' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          EDGE_LANGS: ${{ vars.EDGE_LANGS }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          NEWS_TEXT: ${{ github.event.client_payload.news }}
        run: |
          if [ -n "$NEWS_TEXT" ]; then python pipeline.py inject; else python pipeline.py auto; fi

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "haber-bot"
          git config user.email "haber-bot@users.noreply.github.com"
          python pipeline.py commit-state
