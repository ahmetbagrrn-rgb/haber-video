name: Hazır videoyu tekrar yayına gönder

on:
  repository_dispatch:
    types: [republish, requeue]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiket(ler)i, boşlukla ayrılmış"
        required: true

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Yeniden yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python pipeline.py ${{ github.event.action == 'requeue' && 'requeue' || 'republish' }} $TAGS
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "haber-bot"
          git config user.email "haber-bot@users.noreply.github.com"
          python pipeline.py commit-state
