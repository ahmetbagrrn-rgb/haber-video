name: Telegram dinleyici

on:
  schedule:
    # Her saat başı ~55 dk boyunca canlı dinler (onay düğmesi saniyeler içinde işlenir)
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Git kimliği
        run: |
          git config user.name "haber-bot"
          git config user.email "haber-bot@users.noreply.github.com"

      - name: Telegram'ı canlı dinle
        env:
          LISTEN_MINUTES: "55"
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          EDGE_LANGS: ${{ vars.EDGE_LANGS }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          # Araçlar arka planda kurulur; onay düğmeleri beklemeden hemen dinlenir
          bash setup_tools.sh > /tmp/setup.log 2>&1 &
          python pipeline.py listen

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "haber-bot"
          git config user.email "haber-bot@users.noreply.github.com"
          python pipeline.py commit-state
