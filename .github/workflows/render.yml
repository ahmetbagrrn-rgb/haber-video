name: Haber videosu üret

on:
  # Make.com buradan tetikler (HTTP isteği -> /dispatches)
  repository_dispatch:
    types: [render]
  # Elle test: Actions sekmesi -> "Haber videosu üret" -> Run workflow
  workflow_dispatch:
    inputs:
      text:
        description: "Haber metni"
        required: true
      publish:
        description: "YouTube/Instagram'da yayınlansın mı?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: video-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts pillow
          mkdir -p fonts
          curl -fsSL -o fonts/Anton-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true
          curl -fsSL -o fonts/PlayfairDisplay-Italic.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf" || true
          curl -fsSL -o fonts/Montserrat-Bold.ttf https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Bold.ttf || true
          ls -la fonts

      - name: Videoyu üret
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          MANUAL_TEXT: ${{ github.event.inputs.text }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || 'true' }}
        run: python render.py

      - name: Videoyu yayınla (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json;print(json.load(open('out/result.json'))['title'])")
          gh release create "$RELEASE_TAG" out/video.mp4 out/thumb.jpg out/result.json \
            --title "$TITLE" --notes-file out/notes.md

      - name: Make'e haber ver
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -z "$MAKE_WEBHOOK_URL" ]; then echo "MAKE_WEBHOOK_URL yok, atlandı"; exit 0; fi
          if [ "$(python -c "import json;print(json.load(open('out/result.json')).get('test'))")" = "True" ]; then echo "Test videosu: yayınlanmadı"; exit 0; fi
          curl -fsS -X POST "$MAKE_WEBHOOK_URL" -H "Content-Type: application/json" --data-binary @out/result.json

      - name: Hata olursa yine de dosyaları sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: out/
          retention-days: 3
